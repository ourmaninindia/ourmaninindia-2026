baseURL = "https://www.ourmaninindia.com/"
languageCode = "en-us"
title = "Our Man in India"
timeout = 60000 # was 25000
# No theme line needed!

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = true
    lineNumbersInTable = true
    noClasses = false

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  category = "categories"
  tag = "tags"
  archive = "archives"

[minify]
  disableHTML = false
  disableCSS = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = true

[build]
  [build.buildStats]
    enable = true

[permalinks]
  blog = "/blog/:slug/"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[pagination]
  pagerSize = 4

[menus]
  [[menus.main]]
    name = "Home"
    url = "/"
    weight = 1
  
  [[menus.main]]
    name = "Blog"
    url = "/blog/"
    weight = 2
  
  [[menus.main]]
    name = "Tech"
    url = "/tech/"
    weight = 2.5
  
  [[menus.main]]
    name = "Cycling"
    url = "/cycling/"
    weight = 2.7
  
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 3
  
  [[menus.main]]
    name = "Contact"
    url = "/contact/"
    weight = 4

[[menus.main]]
    name = "Search"
    url = "/search/"
    weight = 5