# Production overrides
baseURL = "https://www.your-live-site.com/"
languageCode = "en"
environment = "production"

# Optional: minify assets in production
[minify]
  disableXML = false 

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[mediaTypes]
  [mediaTypes."font/woff"]
    suffixes = ["woff"]
  [mediaTypes."font/woff2"]
    suffixes = ["woff2"]

[outputFormats]
  [outputFormats.WOFF]
    mediaType = "font/woff"
    isPlainText = false
  [outputFormats.WOFF2]
    mediaType = "font/woff2"
    isPlainText = false