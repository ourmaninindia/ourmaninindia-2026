[build]
  publish = "public"
 command = "npm install && mkdir -p $HOME/bin && ln -s $PWD/node_modules/.bin/sass $HOME/bin/sass && export PATH=$HOME/bin:$PATH && hugo --gc --minify"
[build.environment]
  HUGO_VERSION = "0.154.5"
  HUGO_ENV = "production"
  HUGO_EXTENDED = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview.environment]
  HUGO_ENV = "production"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  
  [functions."subscribe"]
    timeout = 10  # 10 seconds (default)
