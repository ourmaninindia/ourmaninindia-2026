[build]
  publish = "public"
  command = """
    curl -sLJO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" && \
    tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" && \
    rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" && \
    export PATH="${HOME}/.local/dart-sass:${PATH}" && \
    hugo --gc --minify
    """

[build.environment]
  HUGO_VERSION = "0.160.1"
  HUGO_EXTENDED = "true"
  HUGO_ENV = "production"
  DART_SASS_VERSION = "1.99.0"
  CONTACT_FROM_EMAIL = "noreply@ourmaninindia.com"

[environment]
  CONTACT_FROM_EMAIL = "alfred@ourmaninindia.com"
  CONTACT_EMAIL = "alfred@ourmaninindia.com"

[functions]
  node_bundler = "esbuild"

# ── Security Headers ──────────────────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://api.brevo.com https://api.sendgrid.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"

# ── Cache static assets ───────────────────────────────────────────────────────

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images — 1 year but not immutable (you might replace an image at same path)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
