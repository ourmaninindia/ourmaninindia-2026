[build]
  publish = "public"
  command = "bash build.sh"

[build.environment]
  HUGO_VERSION = "0.154.5"
  HUGO_ENV = "production"
  HUGO_EXTENDED = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview.environment]
  HUGO_ENV = "production"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  
  [functions."subscribe"]
    timeout = 10  # 10 seconds (default)
