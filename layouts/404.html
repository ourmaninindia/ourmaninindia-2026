{{ define "title" }}{{ .Title }} | {{ site.Title }}{{ end }}

{{ define "main" }}
<div class="display-template hidden">
  404.html
</div>

<div class="container">
    <div class="error-page">
        <h1 class="error-page__code">404</h1>
        <h2 class="error-page__title">{{ i18n "ep-error" }}</h2>
        <p class="error-page__description">
            {{ i18n "ep-error-description" }}
        </p>
        <div class="error-page__actions">
            <a href="/" class="button">{{ i18n "home" }}</a>
            <a href="/search" class="button button--secondary">{{ i18n "ep-browse" }}</a>
        </div>
    </div>
</div>  

{{ end }}
