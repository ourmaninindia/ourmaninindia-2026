{{ define "title" }}{{ .Title }} | {{ .Site.Title }}{{ end }}

{{ define "main" }}
<div class="display-template hidden">_default/search.html</div>

<div class="contents__container">
    <article class="single">
        <header class="contents__header">
             <h1 class="contents__title">Search</h1>
                <p class="contents__description">Search through all posts</p>
        </header>
        
        <div class="search-box">
            <input 
                type="text" 
                id="search-input" 
                class="search-box__input" 
                placeholder="Search articles..."
                autocomplete="off"
                aria-label="Search">
            <button id="search-clear" class="search-box__clear" aria-label="Clear search">×</button>
        </div>
        
        <div id="search-stats" class="search-stats"></div>
        <div id="search-results" class="search-results"></div>
    </article>
</div>

{{/* Load Fuse.js */}}
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js" 
        integrity="sha256-42IbU8t3tOwwbexB7ZVRHm3YDRf65aBPPjRtIUufj5I=" 
        crossorigin="anonymous">
</script>

{{ end }}
