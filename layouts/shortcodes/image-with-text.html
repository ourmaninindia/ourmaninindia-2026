<div class="image-with-text">
  <figure class="image {{ with .Get " class" }} {{.}} {{ else }} image-left {{ end }}">
    <img src="{{ .Get "src" }}" 
      {{- with .Get "width" }}  width="{{ . }}" {{ end }} 
      {{- with .Get "height" }} height="{{ . }}" {{ end }} 
      {{- with .Get "alt" }} alt="{{ . }}" {{ end }} />
    <figcaption>
      {{ .Get "caption" }}
    </figcaption>
  </figure>
  <div>{{ .Inner | markdownify }}</div>
</div>
