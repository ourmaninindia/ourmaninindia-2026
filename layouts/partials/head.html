<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#20123a">

<!-- Preconnect for external domains -->
<link rel="preconnect" href="https://www.googletagmanager.com">
<link rel="preconnect" href="https://www.google-analytics.com">
<link rel="preconnect" href="https://api.brevo.com" crossorigin>

<link rel="modulepreload" href="/js/cookieconsent.esm.js">

<!-- Preload critical fonts -->
<link rel="preload" href="/fonts/arapey/Arapey-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/halimun/halimun.woff2" as="font" type="font/woff2" crossorigin>

<title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>

<!-- SEO Meta Tags -->
<meta name="description" content="{{ .Description | default .Site.Params.description }}">
<meta name="keywords" content="{{ delimit .Keywords `,` }}">
<meta name="author" content="{{ .Params.author | default .Site.Params.author }}">

<!-- Open Graph -->
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:title" content="{{ .Title }} | {{ .Site.Title }}">
<meta property="og:description" content="{{ .Description | default .Site.Params.description }}">
<meta property="og:locale" content="{{ .Site.Language.Lang }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
{{ $ogImage := .Params.image | default .Params.featured_image }}
{{ with $ogImage }}
<meta property="og:image" content="{{ . | absURL }}">
<meta property="og:image:alt" content="{{ $.Title }}">
{{ end }}
{{ if .IsPage }}
<meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
<meta property="article:modified_time" content="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">
{{ with .Params.author }}<meta property="article:author" content="{{ . }}">{{ end }}
{{ end }}

<!-- Social sharing (Twitter Cards — also used by LinkedIn, Slack, Discord) -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="{{ .Permalink }}">
<meta name="twitter:title" content="{{ .Title }} | {{ .Site.Title }}">
<meta name="twitter:description" content="{{ .Description | default .Site.Params.description }}">
{{ with $ogImage }}
<meta name="twitter:image" content="{{ . | absURL }}">
<meta name="twitter:image:alt" content="{{ $.Title }}">
{{ end }}

<!-- Canonical URL and manifest -->
<link rel="canonical" href="{{ .Permalink }}">
<link rel="manifest" href="/manifest.json">

<!-- Multilingual alternates -->
{{ range .Translations }}
<link rel="alternate" hreflang="{{ .Site.Language.Lang }}" href="{{ .Permalink }}">
{{ end }}
<link rel="alternate" hreflang="{{ .Site.Language.Lang }}" href="{{ .Permalink }}">
<link rel="alternate" hreflang="x-default" href="{{ .Permalink }}">

<!-- Schema.org — BlogPosting / WebSite -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "{{ if .IsPage }}BlogPosting{{ else }}WebSite{{ end }}",
  "headline": "{{ .Title }}",
  "description": "{{ .Description | default .Site.Params.description }}",
  "url": "{{ .Permalink }}"
  {{ if .IsPage }},
  "datePublished": "{{ .Date.Format "2006-01-02" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02" }}",
  "author": {
    "@type": "Person",
    "name": "{{ .Params.author | default .Site.Params.author }}"
  }
  {{ end }},
  "publisher": {
    "@type": "Organization",
    "name": "{{ .Site.Title }}",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ .Site.Params.logo | absURL }}"
    }
  }
}
</script>

{{ if .IsPage }}
<!-- Schema.org — BreadcrumbList: Home → Section → Page -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ .Site.BaseURL }}"
    }
    {{ with .CurrentSection }},
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ .Title }}",
      "item": "{{ .Permalink }}"
    }
    {{ end }},
    {
      "@type": "ListItem",
      "position": 3,
      "name": "{{ .Title }}",
      "item": "{{ .Permalink }}"
    }
  ]
}
</script>
{{ end }}

{{ partial "site-style.html" . }}
