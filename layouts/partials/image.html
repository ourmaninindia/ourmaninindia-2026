{{/* Usage: {{ partial "image.html" . }} */}}

{{ with .Resources.GetMatch .Params.featured_image }}
  {{ $img400  := .Resize "400x webp q85" }}
  {{ $img800  := .Resize "800x webp q85" }}
  {{ $img1200 := .Resize "1200x webp q85" }}

  <figure class="image-with-text">
    <picture>
      <source type="image/webp"
              srcset="{{ $img400.RelPermalink }} 400w,
                      {{ $img800.RelPermalink }} 800w,
                      {{ $img1200.RelPermalink }} 1200w"
              sizes="(max-width: 480px) 100vw,
                     (max-width: 768px) 50vw,
                     800px">
      <img src="{{ $img800.RelPermalink }}"
           alt="{{ $.Params.alt | default $.Params.caption }}"
           loading="lazy"
           decoding="async"
           width="{{ $img800.Width }}"
           height="{{ $img800.Height }}">
    </picture>
    {{ with $.Params.caption }}
      <figcaption>{{ . }}</figcaption>
    {{ end }}
  </figure>
{{ end }}
