<!-- background featured_image -->

{{ $img := .Resources.Get .Params.featured_image }}
{{ $alt := .Params.featured_alt | default .Title }}
{{ if $img }}
<figure class="single__hero-bg">
    <img class="contents__background" src="{{ $img.RelPermalink }}" alt="{{ $alt }}">
    <figcaption>{{ $alt }}</figcaption>
</figure>
{{ end }}
