<h3 class="widget__title">{{ i18n "recentPosts" }}</h3>
{{ $posts := where .Site.RegularPages "Section" .Section }}
{{ range first 5 $posts }}
    <a href="{{ .RelPermalink }}" class="widget__recent-post">
        <div class="widget__recent-thumb">
            {{ $image := .Resources.GetMatch (.Params.featured_image | default "featured*") }}
            {{ if $image }}
                <img src="{{ $image.RelPermalink }}" alt="{{ .Title }}">
            {{ else }}
                <div class="widget__recent-post--no-image"></div>
            {{ end }}
        </div>
        <div class="widget__recent-info">
            <h4>{{ .Title }}</h4>
            <div class="widget__recent-date">{{ .Date.Format "Jan 02, 2006" }}</div>
        </div>
    </a>
{{ end }}
