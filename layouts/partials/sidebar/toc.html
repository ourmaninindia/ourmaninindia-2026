<!-- table of content widget -->
<div class="widget">
    <h3 class="widget__title">{{ i18n "toc" }}</h3>
    <div class="toc">
        <button class="toc__toggle" aria-expanded="true" aria-controls="tocNav">
            <span class="toc__toggle-icon">−</span> Contents
        </button>
        <nav id="tocNav">
            {{ .TableOfContents }}
        </nav>
    </div>
</div>
