<h3 class="widget-title">{{ i18n "categories" }}</h3>
<div class="widget-content">

    {{ $categories := .Site.Taxonomies.categories }}
    {{ if $categories }}

    <!-- Accessible label, visually hidden -->
    <label for="category-dropdown" class="sr-only">{{ i18n "categories" }}</label>

    <select 
        id="category-dropdown" 
        name="category" 
        class="category__dropdown" 
        onchange="if(this.value) window.location.href=this.value">
        <option value="">{{ i18n "selectCategory" }} ({{ len $categories }} categories)</option>
        {{ range $name, $taxonomy := $categories }}
        <option value="{{ " categories" | relLangURL }}/{{ $name | urlize }}">
            {{ $name }} ({{ len $taxonomy.Pages }})
        </option>
        {{ end }}
    </select>
    {{ end }}
</div>
